name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17, cache: maven }
      - run: mvn -B verify
      - run: java -jar target/private-credit-analytics-1.0.0.jar samples/loans.csv samples/financials.csv 6.0 2.0
